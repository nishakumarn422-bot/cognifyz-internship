<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery and Slideshow | Level 3 Task 1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>My Image Gallery</h1>

  <!-- Thumbnails: click opens the enlarged image -->
  <section class="gallery">
    <a href="#img1"><img src="https://picsum.photos/id/10/300/200" alt="Forest"></a>
    <a href="#img2"><img src="https://picsum.photos/id/11/300/200" alt="Lake"></a>
    <a href="#img3"><img src="https://picsum.photos/id/12/300/200" alt="Beach"></a>
    <a href="#img4"><img src="https://picsum.photos/id/13/300/200" alt="Coast"></a>
  </section>

  <!-- Enlarged images -->
  <div class="lightbox" id="img1">
    <a href="#" class="close">&times;</a>
    <img src="https://picsum.photos/id/10/1000/700" alt="Forest View">
  </div>
  <div class="lightbox" id="img2">
    <a href="#" class="close">&times;</a>
    <img src="https://picsum.photos/id/11/1000/700" alt="Lake View">
  </div>
  <div class="lightbox" id="img3">
    <a href="#" class="close">&times;</a>
    <img src="https://picsum.photos/id/12/1000/700" alt="Beach View">
  </div>
  <div class="lightbox" id="img4">
    <a href="#" class="close">&times;</a>
    <img src="https://picsum.photos/id/13/1000/700" alt="Coast View">
  </div>

  <h1>Featured Slideshow</h1>

  <!-- Auto slideshow using only HTML + CSS -->
  <div class="slideshow">
    <img class="slide s1" src="https://picsum.photos/id/14/900/450" alt="Rocky Shore">
    <img class="slide s2" src="https://picsum.photos/id/15/900/450" alt="Calm Sea">
    <img class="slide s3" src="https://picsum.photos/id/16/900/450" alt="Cloudy Coast">
  </div>

</body>
</html>
