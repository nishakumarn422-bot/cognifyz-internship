<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Cards | Level 2 Task 1</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">

    <!-- Part 1: Responsive cards -->
    <h1 class="text-center mb-4">Responsive Card Component</h1>
    <div class="row g-4">

      <!-- Mobile: 1 card per row, Tablet: 2, Desktop: 3 -->
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100 shadow-sm">
          <img src="https://picsum.photos/id/10/400/250" class="card-img-top" alt="Forest">
          <div class="card-body">
            <h5 class="card-title">Nature</h5>
            <p class="card-text">A short description for the first card goes here.</p>
            <a href="#" class="btn btn-primary">Read more</a>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100 shadow-sm">
          <img src="https://picsum.photos/id/11/400/250" class="card-img-top" alt="Lake">
          <div class="card-body">
            <h5 class="card-title">Travel</h5>
            <p class="card-text">A short description for the second card goes here.</p>
            <a href="#" class="btn btn-primary">Read more</a>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100 shadow-sm">
          <img src="https://picsum.photos/id/12/400/250" class="card-img-top" alt="Beach">
          <div class="card-body">
            <h5 class="card-title">Beach</h5>
            <p class="card-text">A short description for the third card goes here.</p>
            <a href="#" class="btn btn-primary">Read more</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Part 2: Responsive grid layout -->
    <h2 class="text-center mt-5 mb-4">Responsive Grid Layout</h2>
    <div class="row g-3 text-center text-white">
      <!-- Mobile: 2 per row, Tablet and above: 4 per row -->
      <div class="col-6 col-md-3"><div class="p-4 bg-primary rounded">Box 1</div></div>
      <div class="col-6 col-md-3"><div class="p-4 bg-success rounded">Box 2</div></div>
      <div class="col-6 col-md-3"><div class="p-4 bg-danger rounded">Box 3</div></div>
      <div class="col-6 col-md-3"><div class="p-4 bg-warning rounded">Box 4</div></div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
